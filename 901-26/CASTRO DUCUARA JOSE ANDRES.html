<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rompecabezas Matemático - Cronometrado</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            color: #2d3436;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-width: 600px;
            width: 100%;
        }
        h1 { color: #0984e3; margin-top: 0; }
        .info-panel {
            display: flex;
            justify-content: space-around;
            font-size: 1.1rem;
            margin-bottom: 15px;
            font-weight: bold;
            background: #dfe6e9;
            padding: 10px;
            border-radius: 8px;
        }
        .timer-warning {
            color: #d63031;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .game-section {
            margin-top: 15px;
        }
        .game-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 10px;
        }
        .card {
            background: #dfe6e9;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
            border: 2px solid transparent;
        }
        .card:hover {
            background: #b2bec3;
        }
        .card.selected {
            border-color: #0984e3;
            background: #74b9ff;
            color: white;
        }
        .card.correct {
            background: #00b894;
            color: white;
            cursor: default;
        }
        #message {
            margin-top: 20px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #2d3436;
        }
        .btn-action {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #0984e3;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            display: none;
        }
        .btn-action:hover {
            background-color: #0163b0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Rompecabezas Matemático 🧩</h1>
    <p>Tienes <strong>5 minutos</strong> para completar los 5 niveles.</p>
    
    <div class="info-panel">
        <div>Nivel: <span id="level-display">1</span> / 5</div>
        <div>Aciertos: <span id="score">0</span> / 4</div>
        <div>Tiempo: <span id="timer">05:00</span></div>
    </div>

    <div class="game-section" id="game-area">
        <div class="game-grid" id="operations-grid"></div>
        <div class="game-grid" id="results-grid"></div>
    </div>

    <div id="message"></div>
    <button class="btn-action" id="nextBtn" onclick="nextLevel()">Siguiente Nivel ➡️</button>
    <button class="btn-action" id="restartBtn" onclick="restartGame()">Jugar de Nuevo 🔄</button>
</div>

<script>
    const levelsData = [
        [
            { op: "4 + 5", res: "9" },
            { op: "10 - 3", res: "7" },
            { op: "6 + 2", res: "8" },
            { op: "9 - 4", res: "5" }
        ],
        [
            { op: "15 + 12", res: "27" },
            { op: "30 - 12", res: "18" },
            { op: "24 + 15", res: "39" },
            { op: "50 - 22", res: "28" }
        ],
        [
            { op: "4 × 6", res: "24" },
            { op: "7 × 5", res: "35" },
            { op: "8 × 8", res: "64" },
            { op: "9 × 3", res: "27" }
        ],
        [
            { op: "36 ÷ 4", res: "9" },
            { op: "72 ÷ 8", res: "9" },
            { op: "12 × 5", res: "60" },
            { op: "81 ÷ 9", res: "9" }
        ],
        [
            { op: "15 × 4", res: "60" },
            { op: "90 - 35", res: "55" },
            { op: "144 ÷ 12", res: "12" },
            { op: "25 + 38", res: "63" }
        ]
    ];

    let currentLevel = 0;
    let currentPairs = [];
    let selectedOp = null;
    let selectedRes = null;
    let score = 0;
    
    let timeLeft = 300; // 5 minutos en segundos
    let timerInterval = null;
    let gameActive = false;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'correct') {
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        } else if (type === 'error') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        } else if (type === 'win') {
            const now = audioCtx.currentTime;
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, index) => {
                const noteOsc = audioCtx.createOscillator();
                const noteGain = audioCtx.createGain();
                noteOsc.connect(noteGain);
                noteGain.connect(audioCtx.destination);
                noteOsc.frequency.value = freq;
                noteGain.gain.setValueAtTime(0.1, now + index * 0.1);
                noteGain.gain.exponentialRampToValueAtTime(0.01, now + index * 0.1 + 0.2);
                noteOsc.start(now + index * 0.1);
                noteOsc.stop(now + index * 0.1 + 0.2);
            });
        } else if (type === 'gameover') {
            // Sonido grave de derrota
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.5);
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }
    }

    function startTimer() {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (!gameActive) return;
            timeLeft--;
            updateTimerDisplay();

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                gameOver();
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        const timerElem = document.getElementById('timer');
        timerElem.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        
        if (timeLeft <= 30) {
            timerElem.classList.add('timer-warning');
        } else {
            timerElem.classList.remove('timer-warning');
        }
    }

    function gameOver() {
        gameActive = false;
        playSound('gameover');
        document.getElementById('game-area').style.display = 'none';
        document.getElementById('message').innerHTML = '❌ <span style="color:#d63031;">¡Se acabó el tiempo! Perdiste.</span>';
        document.getElementById('restartBtn').style.display = 'inline-block';
        document.getElementById('nextBtn').style.display = 'none';
    }

    function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function initGame() {
        currentLevel = 0;
        timeLeft = 300;
        gameActive = true;
        document.getElementById('game-area').style.display = 'block';
        updateTimerDisplay();
        startTimer();
        loadLevel();
    }

    function loadLevel() {
        currentPairs = [...levelsData[currentLevel]];
        score = 0;
        
        document.getElementById('level-display').textContent = currentLevel + 1;
        document.getElementById('score').textContent = score;
        document.getElementById('message').textContent = '';
        document.getElementById('nextBtn').style.display = 'none';
        document.getElementById('restartBtn').style.display = 'none';
        
        selectedOp = null;
        selectedRes = null;

        renderGrid();
    }

    function renderGrid() {
        const opsDiv = document.getElementById('operations-grid');
        const resDiv = document.getElementById('results-grid');
        
        opsDiv.innerHTML = '';
        resDiv.innerHTML = '';

        const ops = shuffle(currentPairs.map((p, index) => ({ ...p, id: index })));
        const ress = shuffle(currentPairs.map((p, index) => ({ ...p, id: index })));

        ops.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.textContent = item.op;
            card.dataset.id = item.id;
            card.dataset.type = 'op';
            card.onclick = () => selectCard(card, 'op');
            opsDiv.appendChild(card);
        });

        ress.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.textContent = item.res;
            card.dataset.id = item.id;
            card.dataset.type = 'res';
            card.onclick = () => selectCard(card, 'res');
            resDiv.appendChild(card);
        });
    }

    function selectCard(card, type) {
        if (!gameActive || card.classList.contains('correct')) return;

        if (type === 'op') {
            if (selectedOp) selectedOp.classList.remove('selected');
            selectedOp = card;
        } else {
            if (selectedRes) selectedRes.classList.remove('selected');
            selectedRes = card;
        }

        card.classList.add('selected');

        if (selectedOp && selectedRes) {
            if (selectedOp.dataset.id === selectedRes.dataset.id) {
                playSound('correct');
                selectedOp.classList.remove('selected');
                selectedRes.classList.remove('selected');
                selectedOp.classList.add('correct');
                selectedRes.classList.add('correct');

                score++;
                document.getElementById('score').textContent = score;

                selectedOp = null;
                selectedRes = null;

                if (score === 4) {
                    if (currentLevel < levelsData.length - 1) {
                        playSound('win');
                        document.getElementById('message').textContent = `🌟 ¡Nivel ${currentLevel + 1} superado!`;
                        document.getElementById('nextBtn').style.display = 'inline-block';
                    } else {
                        gameActive = false;
                        clearInterval(timerInterval);
                        playSound('win');
                        document.getElementById('message').innerHTML = '🏆 <span style="color:#00b894;">¡Felicidades! ¡Completaste todos los niveles a tiempo!</span>';
                        document.getElementById('restartBtn').style.display = 'inline-block';
                    }
                }
            } else {
                playSound('error');
                setTimeout(() => {
                    if (selectedOp) selectedOp.classList.remove('selected');
                    if (selectedRes) selectedRes.classList.remove('selected');
                    selectedOp = null;
                    selectedRes = null;
                }, 400);
            }
        }
    }

    function nextLevel() {
        currentLevel++;
        loadLevel();
    }

    function restartGame() {
        initGame();
    }

    initGame();
</script>

</body>
</html>
