<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Juego de Inglés - Pixel Art SVG Edition</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --panel-color: #16213e;
            --text-color: #e94560;
            --text-light: #ffffff;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 10px;
        }

        #game-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #hud {
            background-color: var(--panel-color);
            padding: 15px;
            border-radius: 12px;
            border: 2px solid var(--text-color);
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        #question {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 8px;
            min-height: 24px;
        }

        #level-indicator {
            font-size: 0.9rem;
            color: #4ecca3;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #canvas-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #121214;
            border-radius: 12px;
            border: 3px solid #333;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 8px;
            width: 180px;
            height: 180px;
            margin: 10px auto 0 auto;
        }

        .btn-dir {
            background-color: var(--panel-color);
            border: 2px solid #4ecca3;
            border-radius: 12px;
            color: white;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 0 #2b7a5e;
            transition: all 0.1s ease;
        }

        .btn-dir:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #2b7a5e;
            background-color: #4ecca3;
        }

        #btn-up {
            grid-column: 2;
            grid-row: 1;
        }

        #btn-left {
            grid-column: 1;
            grid-row: 2;
        }

        #btn-right {
            grid-column: 3;
            grid-row: 2;
        }

        #btn-down {
            grid-column: 2;
            grid-row: 3;
        }

        @media (min-width: 768px) {
            #controls {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div id="game-container">
        <div id="hud">
            <div id="level-indicator">Nivel 1/6</div>
            <div id="question">Cargando desafío...</div>
        </div>

        <div id="canvas-wrapper">
            <canvas id="gameCanvas" width="500" height="500"></canvas>
        </div>

        <div id="controls">
            <button class="btn-dir" id="btn-up">▲</button>
            <button class="btn-left btn-dir" id="btn-left">◀</button>
            <button class="btn-right btn-dir" id="btn-right">▶</button>
            <button class="btn-dir" id="btn-down">▼</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const playerSvgFrames = {
            idle: `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
            <path d="M4 1h8v1H4zM3 2h10v2H3z" fill="#e94560"/>
            <path d="M4 4h8v4H4z" fill="#ffcea3"/>
            <path d="M5 5h2v1H5zM9 5h2v1H9z" fill="#1a1a2e"/>
            <path d="M3 8h10v5H3z" fill="#4ecca3"/>
            <path d="M2 9h1v3H2zM13 9h1v3H13z" fill="#ffcea3"/>
            <path d="M4 13h2v2H4zM10 13h2v2H10z" fill="#be8f63"/>
        </svg>
    `,
            walk: `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
            <path d="M4 2h8v1H4zM3 3h10v2H3z" fill="#e94560"/>
            <path d="M4 5h8v4H4z" fill="#ffcea3"/>
            <path d="M5 6h2v1H5zM9 6h2v1H9z" fill="#1a1a2e"/>
            <path d="M3 9h10v4H3z" fill="#4ecca3"/>
            <path d="M2 8h1v3H2zM13 10h1v3H13z" fill="#ffcea3"/>
            <path d="M3 13h2v1H3zM4 14h2v1H4zM10 13h2v2H10z" fill="#be8f63"/>
        </svg>
    `
        };

        const images = {};
        function loadPlayerAssets() {
            for (let key in playerSvgFrames) {
                const blob = new Blob([playerSvgFrames[key]], { type: 'image/svg+xml' });
                const url = URL.createObjectURL(blob);
                const img = new Image();
                img.src = url;
                images[key] = img;
            }
        }
        loadPlayerAssets();

        const database = [
            { q: "Traduce: '¿Cómo estás?'", a: "How are you?", fake: "What is your name?" },
            { q: "Completa: 'She ___ my best friend.'", a: "is", fake: "are" },
            { q: "Pasado del verbo 'GO'", a: "went", fake: "gone" },
            { q: "¿Qué significa 'Apple'?", a: "Manzana", fake: "Plátano" },
            { q: "Contrario de 'Beautiful'", a: "Ugly", fake: "Pretty" },
            { q: "Traduce: 'Tengo hambre'", a: "I am hungry", fake: "I am thirsty" }
        ];

        let currentLevel = 1;
        let levelData = {};

        const player = {
            x: 50, y: 250,
            size: 36,
            speed: 4.5,
            isMoving: false,
            animTimer: 0,
            currentFrame: 'idle',
            direction: 1 // 1: Derecha, -1: Izquierda
        };

        let enemies = [];
        let blocks = [];
        let goalZone = { x: 440, y: 200, w: 50, h: 100, active: false };

        const keys = {};
        const touchControls = { up: false, down: false, left: false, right: false };

        function initLevel(level) {
            levelData = database[level - 1];
            document.getElementById('level-indicator').innerText = `Nivel ${level}/6`;
            document.getElementById('question').innerText = levelData.q;

            player.x = 30;
            player.y = 230;
            player.isMoving = false;
            goalZone.active = false;

            const isCorrectTop = Math.random() > 0.5;
            blocks = [
                {
                    x: 320, y: 100, w: 100, h: 80,
                    text: isCorrectTop ? levelData.a : levelData.fake,
                    isCorrect: isCorrectTop
                },
                {
                    x: 320, y: 320, w: 100, h: 80,
                    text: isCorrectTop ? levelData.fake : levelData.a,
                    isCorrect: !isCorrectTop
                }
            ];

            enemies = [];
            const enemyCount = level <= 3 ? level * 2 : level + 2;
            const baseSpeed = level <= 3 ? 1.5 + (level * 0.7) : 3.2;

            for (let i = 0; i < enemyCount; i++) {
                enemies.push({
                    x: 120 + (i * 30),
                    y: Math.random() * (canvas.height - 40),
                    size: 18,
                    speedY: (Math.random() > 0.5 ? 1 : -1) * (baseSpeed + Math.random())
                });
            }
        }

        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        function bindTouch(id, prop) {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); touchControls[prop] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); touchControls[prop] = false; });
        }
        bindTouch('btn-up', 'up');
        bindTouch('btn-down', 'down');
        bindTouch('btn-left', 'left');
        bindTouch('btn-right', 'right');

        function update() {
            let dx = 0;
            let dy = 0;

            if (keys['ArrowUp'] || touchControls.up) dy = -player.speed;
            if (keys['ArrowDown'] || touchControls.down) dy = player.speed;
            if (keys['ArrowLeft'] || touchControls.left) { dx = -player.speed; player.direction = -1; }
            if (keys['ArrowRight'] || touchControls.right) { dx = player.speed; player.direction = 1; }

            player.x += dx;
            player.y += dy;

            if (dx !== 0 || dy !== 0) {
                player.isMoving = true;
                player.animTimer++;
                if (player.animTimer % 20 < 10) {
                    player.currentFrame = 'walk';
                } else {
                    player.currentFrame = 'idle';
                }
            } else {
                player.isMoving = false;
                player.currentFrame = 'idle';
            }

            player.x = Math.max(0, Math.min(canvas.width - player.size, player.x));
            player.y = Math.max(0, Math.min(canvas.height - player.size, player.y));

            enemies.forEach(enemy => {
                enemy.y += enemy.speedY;
                if (enemy.y <= 0 || enemy.y >= canvas.height - enemy.size) {
                    enemy.speedY *= -1;
                }

                if (player.x < enemy.x + enemy.size && player.x + player.size > enemy.x &&
                    player.y < enemy.y + enemy.size && player.y + player.size > enemy.y) {
                    initLevel(currentLevel);
                }
            });

            const playerCenterX = player.x + player.size / 2;
            const playerCenterY = player.y + player.size / 2;
            blocks.forEach(block => {
                if (playerCenterX >= block.x && playerCenterX <= block.x + block.w &&
                    playerCenterY >= block.y && playerCenterY <= block.y + block.h) {
                    if (block.isCorrect) {
                        goalZone.active = true;
                    } else {
                        initLevel(currentLevel);
                    }
                }
            });

            if (goalZone.active &&
                player.x < goalZone.x + goalZone.w && player.x + player.size > goalZone.x &&
                player.y < goalZone.y + goalZone.h && player.y + player.size > goalZone.y) {
                if (currentLevel < 6) {
                    currentLevel++;
                    initLevel(currentLevel);
                } else {
                    alert("¡Felicidades! Has completado con éxito los 6 niveles de inglés.");
                    currentLevel = 1;
                    initLevel(currentLevel);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = goalZone.active ? 'rgba(78, 204, 163, 0.8)' : 'rgba(255, 255, 255, 0.1)';
            ctx.fillRect(goalZone.x, goalZone.y, goalZone.w, goalZone.h);
            ctx.strokeStyle = '#4ecca3';
            ctx.lineWidth = 2;
            ctx.strokeRect(goalZone.x, goalZone.y, goalZone.w, goalZone.h);

            ctx.fillStyle = '#fff';
            ctx.font = '12px Arial';
            ctx.fillText("META", goalZone.x + 8, goalZone.y + 55);

            blocks.forEach(block => {
                ctx.fillStyle = '#16213e';
                ctx.fillRect(block.x, block.y, block.w, block.h);
                ctx.strokeStyle = '#e94560';
                ctx.strokeRect(block.x, block.y, block.w, block.h);

                ctx.fillStyle = '#fff';
                ctx.font = '13px Arial';
                ctx.fillText(block.text, block.x + 8, block.y + 45);
            });

            enemies.forEach(enemy => {
                ctx.fillStyle = '#e94560';
                ctx.fillRect(enemy.x, enemy.y, enemy.size, enemy.size);
            });

            const activeImage = images[player.currentFrame];
            if (activeImage && activeImage.complete) {
                ctx.save();
                if (player.direction === -1) {
                    ctx.translate(player.x + player.size, player.y);
                    ctx.scale(-1, 1);
                    ctx.drawImage(activeImage, 0, 0, player.size, player.size);
                } else {
                    ctx.drawImage(activeImage, player.x, player.y, player.size, player.size);
                }
                ctx.restore();
            } else {
                ctx.fillStyle = '#00bcd4';
                ctx.fillRect(player.x, player.y, player.size, player.size);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        initLevel(currentLevel);
        loop();
    </script>

</body>

</html>
