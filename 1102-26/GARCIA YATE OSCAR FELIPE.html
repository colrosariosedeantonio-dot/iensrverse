<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>El Secreto del Faro</title>
<style>
:root{--bg:#101a32;--panel:#1b2d4b;--gold:#ffdc8a;--mint:#9ce5d1;--pink:#f39ac0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#315873,#10172d 70%);color:#fff8e7;font-family:system-ui,sans-serif}#app{max-width:740px;margin:auto;padding:15px}button{border:0;border-radius:14px;padding:13px 16px;font-weight:800;font-size:15px;cursor:pointer;background:linear-gradient(135deg,#ffe7a5,#ffbd72);color:#19233c;box-shadow:0 5px #a66e43}button:active{transform:translateY(3px);box-shadow:0 2px #a66e43}.screen{display:none}.active{display:block}.coverbox{min-height:calc(100vh - 30px);display:grid;place-items:center}.cover{position:relative;overflow:hidden;width:min(100%,390px);aspect-ratio:3/5;border:4px solid #f7d88e;border-radius:27px;text-align:center;padding:25px 18px;background:linear-gradient(#153955,#367d8a 48%,#101a32 78%);box-shadow:0 25px 70px #0009}.stars{position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1.5px),radial-gradient(#ffe5a1 1px,transparent 1.5px);background-size:37px 41px,61px 63px;opacity:.8}.cover small{position:relative;letter-spacing:4px;font-weight:900;color:#ffe5a1}.cover h1{position:relative;font: bold clamp(38px,10vw,54px)/.92 Georgia,serif;text-shadow:0 4px #173047,0 8px 22px #061323;margin:18px 0 10px}.cover p{position:relative;max-width:260px;margin:8px auto;color:#e7f8f5}.light{position:absolute;top:31%;left:50%;transform:translateX(-50%);width:110px;height:220px}.lamp{position:absolute;top:0;left:28px;width:55px;height:45px;border:5px solid #f6d28a;border-radius:10px;background:#fff0ad;box-shadow:0 0 36px 18px #ffe58a77}.tower{position:absolute;top:43px;left:17px;width:78px;height:172px;background:repeating-linear-gradient(90deg,#f8e7c7 0 25px,#d87568 25px 50px);clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}.door{position:absolute;bottom:0;left:42px;width:28px;height:43px;background:#152743;border-radius:14px 14px 0 0}.rocks{position:absolute;bottom:20%;left:-5%;width:110%;height:85px;background:#142e40;clip-path:polygon(0 75%,15% 45%,29% 67%,42% 20%,58% 65%,74% 36%,88% 70%,100% 43%,100% 100%,0 100%)}.sea{position:absolute;bottom:0;left:-10%;width:120%;height:28%;background:repeating-radial-gradient(ellipse at 50% 0%,#55aab0 0 4px,#205a70 5px 11px,#143d5c 12px 18px);border-radius:50% 50% 0 0}.start{position:absolute;bottom:8%;left:12%;width:76%;z-index:2}.tiny{position:absolute;bottom:3%;left:0;right:0;font-size:10px;letter-spacing:2px}.panel{background:#1b2d4bee;border:1px solid #58758d;border-radius:20px;padding:17px;margin:12px 0;box-shadow:0 12px 35px #0004}.top{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}.pill{background:#294363;border:1px solid #607c91;border-radius:30px;padding:7px 10px;font-size:13px;font-weight:800}h2{font: bold clamp(26px,6vw,34px) Georgia,serif;color:#ffe5a1;margin:8px 0}.art{height:175px;border-radius:16px;display:grid;place-items:center;font-size:90px;background:linear-gradient(145deg,#2a536b,#14233e);border:1px solid #55758a;margin:12px 0}.choices{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}.choices button{background:linear-gradient(135deg,#c9f3e3,#7fcac4);box-shadow:0 5px #397e82;text-align:left}.notice{padding:12px;border-left:4px solid var(--gold);border-radius:12px;background:#2a4261;margin:10px 0}.progress{height:9px;background:#0b1426;border-radius:20px;overflow:hidden;margin:10px 0}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#77d8cf,#ffe08d)}.bag{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.tile{background:#29415f;border:1px solid #5b7790;border-radius:13px;text-align:center;padding:10px;font-size:13px}.tile b{display:block;font-size:25px}.center{text-align:center}.small{font-size:12px;color:#b9ced9}#feedback{min-height:25px;color:#ffe5a1;font-weight:800}footer{text-align:center;color:#9bb3c4;font-size:11px;padding:12px}@media(min-width:600px){.choices{grid-template-columns:1fr 1fr}.art{height:220px}}
</style></head><body><div id="app">
<section id="cover" class="screen active"><div class="coverbox"><div class="cover"><div class="stars"></div><small>UNA AVENTURA DE MISTERIO</small><h1>EL SECRETO<br>DEL FARO</h1><p>Una isla, un mapa perdido y una noche para descubrir la verdad.</p><div class="light"><div class="lamp"></div><div class="tower"></div><div class="door"></div></div><div class="rocks"></div><div class="sea"></div><button class="start" onclick="begin()">COMENZAR AVENTURA ✦</button><div class="tiny">EXPLORA · RESUELVE · DESCUBRE</div></div></div></section>
<section id="game" class="screen"><div class="top"><span class="pill">🧭 <span id="who">Explorador</span></span><span class="pill">⭐ <span id="score">0</span></span><span class="pill">🎒 <span id="count">0</span>/4 pistas</span></div><div class="progress"><span id="bar"></span></div><div class="panel"><div class="small" id="chapter"></div><h2 id="title"></h2><div class="art" id="art"></div><div id="story"></div><div id="feedback"></div><div class="choices" id="choices"></div></div><div class="panel"><b>🎒 Mochila de pistas</b><div class="bag" id="bag" style="margin-top:10px"></div></div><footer>EL SECRETO DEL FARO · Aventura interactiva</footer></section>
<section id="end" class="screen"><div class="panel center"><div style="font-size:75px">🏆</div><h2 id="endtitle">¡Misterio resuelto!</h2><p id="endtext"></p><div class="bag"><div class="tile"><b id="finalscore">0</b>Puntos</div><div class="tile"><b id="finalclues">0/4</b>Pistas</div></div><button style="margin-top:20px" onclick="location.reload()">JUGAR OTRA VEZ ↻</button></div></section>
</div>
<script>
const $=x=>document.getElementById(x);let name='Explorador',score=0,found=[],step=0;
const clue=['La brújula antigua','La nota cifrada','La llave de cobre','El cristal azul'],emoji=['🧭','📜','🗝️','💎'];
function screen(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')}
function begin(){let n=prompt('¿Qué nombre quieres usar?','Explorador');if(n&&n.trim())name=n.trim().slice(0,18);$('who').textContent=name;screen('game');render()}
function collect(i){if(!found.includes(i)){found.push(i);score+=20}}
const scenes=[
{c:'CAPÍTULO 1 · LA LLEGADA',t:'La isla de Bruma',a:'⛵🌊',s:'Tu barco llega a una isla que no aparece en los mapas. El faro está apagado y una botella flota cerca de la orilla. ¿Qué haces primero?',o:[['🧴 Revisar la botella',1],['🏚️ Ir directamente al faro',2],['🌴 Explorar la playa',3]]},
{c:'CAPÍTULO 1 · LA LLEGADA',t:'Un mensaje en la botella',a:'📜',s:'Dentro hay un papel: “Busca el objeto que siempre señala el norte”. ¿Cuál necesitas?',q:'¿Qué instrumento señala los puntos cardinales?',ans:['Brújula','Termómetro','Reloj de arena'],ok:0,win:()=>collect(0),next:2},
{c:'CAPÍTULO 2 · EL BOSQUE',t:'El sendero de los árboles',a:'🌲🦉',s:'La brújula vibra y apunta hacia un bosque. Una placa tiene un acertijo.',q:'Tengo hojas, pero no soy árbol; tengo lomo, pero no soy animal. ¿Qué soy?',ans:['Un cuaderno','Una montaña','Una ventana'],ok:0,win:()=>score+=10,next:3},
{c:'CAPÍTULO 2 · EL BOSQUE',t:'La nota cifrada',a:'🦋📜',s:'En un tronco hueco encuentras una nota: “El agua refleja lo que el cielo guarda”.',o:[['🌌 Mirar el reflejo en el lago',4],['🔥 Encender una fogata',5],['🪨 Golpear la roca',5]]},
{c:'CAPÍTULO 3 · EL LAGO',t:'El reflejo secreto',a:'🌙💧',s:'Bajo un puente ves una caja cerrada. Para abrirla debes responder.',q:'¿Qué planeta es conocido como el planeta rojo?',ans:['Marte','Venus','Júpiter'],ok:0,win:()=>collect(1),next:6},
{c:'CAPÍTULO 3 · EL LAGO',t:'Un desvío inesperado',a:'🌫️',s:'La niebla te hace perder tiempo. Unas huellas regresan al sendero.',o:[['👣 Seguir las huellas',4],['🧭 Consultar la brújula',4]]},
{c:'CAPÍTULO 4 · EL FARO',t:'La puerta cerrada',a:'🗼🔒',s:'La puerta del faro tiene una inscripción: “Abro puertas, pero no soy mano”.',q:'¿Qué objeto necesitas para abrir una cerradura común?',ans:['Una llave','Una brújula','Una lupa'],ok:0,win:()=>collect(2),next:7},
{c:'CAPÍTULO 4 · EL FARO',t:'La última luz',a:'💎✨',s:'En lo alto encuentras un cristal azul. La máquina pide una última respuesta.',q:'¿Qué gas absorben principalmente las plantas para realizar la fotosíntesis?',ans:['Dióxido de carbono','Oxígeno','Helio'],ok:0,win:()=>collect(3),next:8}
];
function update(){$('score').textContent=score;$('count').textContent=found.length;$('bar').style.width=(step/8*100)+'%';$('bag').innerHTML=found.length?found.map(i=>`<div class="tile"><b>${emoji[i]}</b>${clue[i]}</div>`).join(''):'<div class="small">Todavía no has recogido pistas.</div>'}
function render(){update();if(step>=8){finish();return}let s=scenes[step];$('chapter').textContent=s.c;$('title').textContent=s.t;$('art').textContent=s.a;$('story').innerHTML='<p>'+s.s+'</p>';$('feedback').textContent='';$('choices').innerHTML='';if(s.q){$('story').innerHTML+=`<div class="notice"><b>🧩 Reto:</b> ${s.q}</div>`;s.ans.forEach((v,i)=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>answer(i,s);$('choices').append(b)})}else{s.o.forEach(([v,to])=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>{if(step===0&&to===1)collect(0);if(step===3&&to===4)collect(1);step=to;render()};$('choices').append(b)})}}
function answer(i,s){[...$('choices').children].forEach(b=>b.disabled=true);if(i===s.ok){score+=15;s.win();$('feedback').textContent='¡Correcto! +15 puntos ✨';$('feedback').style.color='#9ce5d1'}else{$('feedback').textContent='Casi… la respuesta era: '+s.ans[s.ok];$('feedback').style.color='#ffb6a7'}update();let b=document.createElement('button');b.textContent='CONTINUAR →';b.style.marginTop='12px';b.onclick=()=>{step=s.next;render()};$('choices').append(b)}
function finish(){update();screen('end');$('endtitle').textContent=found.length===4?'¡Has encendido el faro!':'¡Aventura completada!';$('endtext').textContent=found.length===4?`¡Excelente, ${name}! Encontraste todas las pistas y devolviste la luz a la isla. El faro guiaba a los barcos perdidos.`:`${name}, llegaste al final y encontraste ${found.length} de las 4 pistas. ¡Puedes intentarlo otra vez!`;$('finalscore').textContent=score;$('finalclues').textContent=found.length+'/4'}
</script></body></html>
